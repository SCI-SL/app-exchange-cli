name: Validate and publish CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and build tools
        run: python -m pip install '.[test]'
      - name: Test standalone CLI contract and inputs
        env:
          CLI_ANYTHING_FORCE_INSTALLED: '1'
        run: python -m pytest cli_anything/slcool/tests/test_core.py -q
      - name: Check code and Unix installer
        run: |
          ruff check cli_anything/slcool
          sh -n install.sh
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python setup.py --version)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify installed wheel outside source directory
        run: |
          python -m venv /tmp/slcool-wheel
          /tmp/slcool-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/slcool-wheel/bin/sl-cool api list --json > slcool-operations.json
          /tmp/slcool-wheel/bin/python -c 'import json; data=json.load(open("slcool-operations.json")); assert len(data) == 29, data'
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sl-cool-cli-distributions
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sl-cool-cli-distributions
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "SL Cool CLI $GITHUB_REF_NAME"
          --generate-notes
